<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Olympic Line Distribution</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
</head>
<body class="login-body">
  <main class="login-wrap">
    <form class="login-card" method="POST" action="/admin/login">
      <img class="login-logo" src="/logo.png" alt="Olympic Line Distribution" width="130" height="130" />
      <h1 class="login-title">Admin Login</h1>

      <div id="login-error" class="login-error" role="alert">Incorrect username or password.</div>

      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      <a href="/" class="login-back">&larr; Back to site</a>
    </form>
  </main>
  <script>
    if (new URLSearchParams(location.search).get("error")) {
      document.getElementById("login-error").style.display = "block";
    }
  </script>
</body>
</html>
