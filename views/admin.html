<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Olympic Line Distribution</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand" aria-label="Olympic Line Distribution home">
        <span class="brand-emblem" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="40" height="40" role="img">
            <circle cx="32" cy="32" r="30" fill="none" stroke="currentColor" stroke-width="2.5"/>
            <path d="M14 40 L26 22 L33 31 L40 20 L50 40 Z" fill="currentColor" opacity="0.9"/>
            <rect x="18" y="42" width="28" height="7" rx="1.5" fill="currentColor"/>
            <line x1="16" y1="52" x2="48" y2="52" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">OLYMPIC</span>
          <span class="brand-sub">ADMIN</span>
        </span>
      </a>
      <nav class="header-nav">
        <a href="/catalog" class="header-link">View Catalog</a>
        <a href="/" class="header-link">Home</a>
        <form method="POST" action="/admin/logout" class="logout-form">
          <button type="submit" class="header-link logout-btn">Log out</button>
        </form>
      </nav>
    </div>
  </header>

  <main class="admin-wrap container">
    <div class="admin-grid">
      <!-- Add product -->
      <section class="admin-panel">
        <h1 class="admin-title">Add a Product</h1>
        <form id="product-form" class="admin-form">
          <div class="field">
            <label for="name">Product name *</label>
            <input type="text" id="name" name="name" required maxlength="120" />
          </div>
          <div class="field-row">
            <div class="field">
              <label for="category">Category</label>
              <input type="text" id="category" name="category" maxlength="60" placeholder="e.g. Beverages" />
            </div>
            <div class="field">
              <label for="sku">SKU</label>
              <input type="text" id="sku" name="sku" maxlength="60" />
            </div>
          </div>
          <div class="field">
            <label for="price">Price (USD)</label>
            <input type="number" id="price" name="price" min="0" step="0.01" placeholder="0.00" />
          </div>
          <div class="field">
            <label for="imageUrl">Image URL</label>
            <input type="url" id="imageUrl" name="imageUrl" maxlength="600" placeholder="https://…" />
          </div>
          <div class="field">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3" maxlength="1000"></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Add Product</button>
          <p id="form-note" class="form-note" role="status" aria-live="polite"></p>
        </form>
      </section>

      <!-- Existing products -->
      <section class="admin-panel">
        <div class="admin-list-head">
          <h2 class="admin-title">Products <span id="count" class="count-badge">0</span></h2>
        </div>
        <div id="admin-list" class="admin-list"></div>
      </section>
    </div>
  </main>

  <script>
    (function () {
      "use strict";
      var form = document.getElementById("product-form");
      var note = document.getElementById("form-note");
      var list = document.getElementById("admin-list");
      var count = document.getElementById("count");

      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }
      function price(p) {
        if (p == null || p === "") return "—";
        var n = Number(p);
        return isFinite(n) ? "$" + n.toFixed(2) : "—";
      }

      function row(p) {
        var thumb = p.imageUrl
          ? '<img src="' + esc(p.imageUrl) + '" alt="" />'
          : '<div class="admin-thumb-noimg">' + esc((p.name || "?").charAt(0).toUpperCase()) + "</div>";
        return (
          '<div class="admin-item" data-id="' + esc(p.id) + '">' +
            '<div class="admin-thumb">' + thumb + "</div>" +
            '<div class="admin-item-body">' +
              "<strong>" + esc(p.name) + "</strong>" +
              '<span class="admin-item-meta">' +
                (p.category ? esc(p.category) + " · " : "") + price(p.price) +
                (p.sku ? " · SKU " + esc(p.sku) : "") +
              "</span>" +
            "</div>" +
            '<button class="btn-delete" data-id="' + esc(p.id) + '" title="Delete">&times;</button>' +
          "</div>"
        );
      }

      function load() {
        fetch("/api/products")
          .then(function (r) { return r.json(); })
          .then(function (data) {
            var items = Array.isArray(data) ? data : [];
            count.textContent = items.length;
            list.innerHTML = items.length
              ? items.map(row).join("")
              : '<p class="admin-empty">No products yet. Add your first one.</p>';
          });
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var payload = {
          name: form.name.value.trim(),
          category: form.category.value.trim(),
          sku: form.sku.value.trim(),
          price: form.price.value,
          imageUrl: form.imageUrl.value.trim(),
          description: form.description.value.trim(),
        };
        if (!payload.name) {
          note.style.color = "#b23b2e";
          note.textContent = "Product name is required.";
          return;
        }
        fetch("/api/products", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        })
          .then(function (r) {
            if (r.status === 401) { window.location.href = "/admin/login"; throw new Error("Signed out"); }
            if (!r.ok) throw new Error("Request failed");
            return r.json();
          })
          .then(function () {
            note.style.color = "";
            note.textContent = "Added “" + payload.name + "” to the catalog.";
            form.reset();
            load();
          })
          .catch(function () {
            note.style.color = "#b23b2e";
            note.textContent = "Couldn't add the product. Please try again.";
          });
      });

      list.addEventListener("click", function (e) {
        var btn = e.target.closest(".btn-delete");
        if (!btn) return;
        var id = btn.getAttribute("data-id");
        if (!confirm("Delete this product?")) return;
        fetch("/api/products/" + id, { method: "DELETE" })
          .then(function (r) {
            if (r.status === 401) { window.location.href = "/admin/login"; throw new Error("Signed out"); }
            if (!r.ok) throw new Error("Request failed");
            load();
          })
          .catch(function () {
            alert("Couldn't delete the product.");
          });
      });

      load();
    })();
  </script>
</body>
</html>
